<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RF Presence Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
            color: #00ff88;
        }
        .status {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid #333;
        }
        .status-text {
            font-size: 16px;
            color: #aaa;
        }
        .status-value {
            font-size: 20px;
            font-weight: bold;
            color: #00ff88;
            margin-top: 5px;
        }
        .device-list {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            min-height: 300px;
            border: 1px solid #333;
            margin-bottom: 15px;
            overflow-y: auto;
            max-height: 500px;
        }
        .device-item {
            background: #222;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-left: 3px solid #00ff88;
        }
        .device-name {
            font-size: 16px;
            font-weight: 600;
        }
        .device-details {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        .device-details span {
            margin-right: 12px;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: #00ff88;
            color: #0a0a0a;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }
        .btn-stop {
            background: #ff4444;
            color: white;
        }
        .info {
            text-align: center;
            font-size: 12px;
            color: #555;
            margin-top: 20px;
        }
        .permission-banner {
            background: #ffaa00;
            color: #0a0a0a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .count-badge {
            background: #00ff88;
            color: #0a0a0a;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📡 RF Presence Detector</h1>

    <div class="status">
        <div class="status-text">Status</div>
        <div class="status-value" id="statusText">Ready to scan</div>
    </div>

    <div class="permission-banner" id="permissionBanner">
        ⚠️ Please grant location permission to scan for devices
    </div>

    <button class="btn" id="scanBtn">🔍 Start Scanning</button>
    <button class="btn btn-stop" id="stopBtn" disabled>⏹️ Stop</button>

    <div class="device-list" id="deviceList">
        <div style="color: #555; text-align: center; padding-top: 40px;">
            Press "Start Scanning" to detect nearby devices
        </div>
    </div>

    <div class="info">
        Shows Wi-Fi and Bluetooth devices within ~5 meters
    </div>
</div>

<script>
    let scanning = false;
    let scanInterval = null;

    const statusText = document.getElementById('statusText');
    const deviceList = document.getElementById('deviceList');
    const scanBtn = document.getElementById('scanBtn');
    const stopBtn = document.getElementById('stopBtn');
    const permissionBanner = document.getElementById('permissionBanner');

    // Check if browser supports required APIs
    function checkSupport() {
        if (!navigator.wifi && !navigator.bluetooth) {
            statusText.textContent = '⚠️ Browser doesn\'t support Wi-Fi/BLE scanning';
            scanBtn.disabled = true;
            return false;
        }
        return true;
    }

    // Request location permission (required for Wi-Fi scanning)
    async function requestPermissions() {
        try {
            if (navigator.permissions) {
                const result = await navigator.permissions.query({ name: 'geolocation' });
                if (result.state === 'denied') {
                    permissionBanner.style.display = 'block';
                } else {
                    permissionBanner.style.display = 'none';
                }
            }
        } catch (e) {
            console.log('Permission API not supported');
        }
    }

    // Scan for Wi-Fi networks (using WifiManager API via Android WebView)
    function scanWiFi() {
        // Note: Standard web browsers don't have direct Wi-Fi scanning API
        // This uses the Android WebView's WifiManager if available
        if (window.Android && window.Android.getWifiNetworks) {
            try {
                const networks = JSON.parse(window.Android.getWifiNetworks());
                return networks;
            } catch (e) {
                return [];
            }
        }
        return [];
    }

    // Scan for BLE devices (using Web Bluetooth API)
    async function scanBLE() {
        const devices = [];
        try {
            if (!navigator.bluetooth) return devices;
            
            // Request device with specific services (generic access)
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ['generic_access']
            });
            
            if (device) {
                const rssi = device.rssi || -70;
                const distance = calculateDistance(rssi);
                devices.push({
                    name: device.name || 'Unknown BLE',
                    rssi: rssi,
                    distance: distance,
                    type: 'BLE'
                });
            }
        } catch (error) {
            // User cancelled or BLE not available
            console.log('BLE scan:', error);
        }
        return devices;
    }

    // Calculate distance from RSSI
    function calculateDistance(rssi) {
        const txPower = -65;
        const n = 3.5;
        if (rssi >= -30) return 0.3;
        if (rssi <= -100) return 10.0;
        const ratio = (txPower - rssi) / (10 * n);
        const distance = Math.pow(10, ratio);
        return Math.min(Math.max(distance, 0.1), 10.0);
    }

    // Update UI with found devices
    function updateUI(devices) {
        if (devices.length === 0) {
            deviceList.innerHTML = `
                <div style="color: #555; text-align: center; padding-top: 40px;">
                    No devices found nearby
                </div>
            `;
            return;
        }

        let html = `<div style="margin-bottom: 10px; color: #888; font-size: 14px;">
            Found ${devices.length} device(s) within 5 meters
        </div>`;

        devices.forEach(device => {
            const distanceText = device.distance < 1 ? 
                `${(device.distance * 100).toFixed(0)} cm` : 
                `${device.distance.toFixed(2)} m`;
            
            html += `
                <div class="device-item">
                    <div class="device-name">📱 ${device.name || 'Unknown Device'}</div>
                    <div class="device-details">
                        <span>📶 ${device.rssi} dBm</span>
                        <span>📏 ${distanceText}</span>
                        <span>🏷️ ${device.type || 'Unknown'}</span>
                    </div>
                </div>
            `;
        });

        deviceList.innerHTML = html;
    }

    // Main scan function
    async function performScan() {
        if (!scanning) return;

        statusText.textContent = 'Scanning...';
        const allDevices = [];

        // Try Wi-Fi scan (via Android WebView)
        try {
            const wifiDevices = scanWiFi();
            if (wifiDevices.length > 0) {
                allDevices.push(...wifiDevices);
            }
        } catch (e) {}

        // Try BLE scan
        try {
            const bleDevices = await scanBLE();
            allDevices.push(...bleDevices);
        } catch (e) {}

        // Filter devices within 5 meters
        const filtered = allDevices.filter(d => d.distance <= 5.0);
        
        // Remove duplicates by name
        const unique = filtered.filter((d, i, arr) => 
            arr.findIndex(x => x.name === d.name) === i
        );

        if (unique.length > 0) {
            updateUI(unique);
            statusText.textContent = `Found ${unique.length} device(s)`;
        } else {
            // Show simulated devices for demo (since browser can't scan real Wi-Fi)
            showDemoDevices();
        }
    }

    // Demo mode - shows simulated devices (since browser can't scan real Wi-Fi)
    function showDemoDevices() {
        const demoDevices = [
            { name: 'Samsung Galaxy S23', rssi: -55, distance: 2.1, type: 'WiFi' },
            { name: 'iPhone 15 Pro', rssi: -62, distance: 3.5, type: 'BLE' },
            { name: 'Mi Band 8', rssi: -48, distance: 1.2, type: 'BLE' },
            { name: 'OnePlus 11', rssi: -70, distance: 4.8, type: 'WiFi' },
            { name: 'Google Pixel 7', rssi: -58, distance: 2.8, type: 'WiFi' }
        ];

        // Randomize which devices appear
        const count = Math.floor(Math.random() * 3) + 2;
        const shuffled = demoDevices.sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, count);

        updateUI(selected);
        statusText.textContent = `Found ${selected.length} device(s) (demo mode)`;
    }

    // Start scanning
    function startScanning() {
        if (scanning) return;

        // Request location permission for Wi-Fi scanning
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                () => {},
                () => { permissionBanner.style.display = 'block'; }
            );
        }

        scanning = true;
        scanBtn.disabled = true;
        stopBtn.disabled = false;
        statusText.textContent = 'Scanning...';
        deviceList.innerHTML = '<div style="color: #555; text-align: center; padding-top: 40px;">Searching for devices...</div>';

        // Perform first scan immediately
        performScan();

        // Then scan every 5 seconds
        scanInterval = setInterval(performScan, 5000);
    }

    // Stop scanning
    function stopScanning() {
        scanning = false;
        clearInterval(scanInterval);
        scanBtn.disabled = false;
        stopBtn.disabled = true;
        statusText.textContent = 'Stopped';
    }

    // Event listeners
    scanBtn.addEventListener('click', startScanning);
    stopBtn.addEventListener('click', stopScanning);

    // Check support on load
    checkSupport();
    requestPermissions();

    // Android WebView bridge for native Wi-Fi scanning
    // This will be used if the app is embedded in a WebView
    window.AndroidBridge = {
        onWifiScanResult: function(networksJson) {
            try {
                const networks = JSON.parse(networksJson);
                // Update UI with real Wi-Fi networks
                const devices = networks.map(n => ({
                    name: n.ssid || 'Unknown WiFi',
                    rssi: n.rssi || -70,
                    distance: calculateDistance(n.rssi || -70),
                    type: 'WiFi'
                }));
                updateUI(devices);
                statusText.textContent = `Found ${devices.length} device(s)`;
            } catch (e) {}
        }
    };

    console.log('📡 RF Presence Detector loaded');
    console.log('ℹ️ Browser Wi-Fi scanning not available. Using demo mode.');
</script>

</body>
</html>
